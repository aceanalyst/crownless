<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — CROWNLESS</title>
<link rel="stylesheet" href="styles.css?v=13">
<style>
/* Buy box rebuilt in Fashion Nova's order and sizes, carried in the page itself so no stale cached stylesheet can override it */
.product-info h1 { font-size: 15px !important; font-weight: 500 !important; margin: 0 !important; }
.name-row { display: flex !important; align-items: flex-start !important; justify-content: space-between !important; gap: 10px !important; }
.wish-btn { background: none !important; border: none !important; font-size: 22px !important; line-height: 1 !important; cursor: pointer !important; color: #111 !important; padding: 0 2px !important; font-family: inherit !important; }
.wish-btn.active { color: #d6001c !important; }
.product-info .price { font-size: 19px !important; font-weight: 700 !important; margin-top: 6px !important; }
.product-info .price.sale { color: #d6001c !important; }
.off-tag { color: #d6001c !important; font-size: 13px !important; font-weight: 700 !important; }
.field-label { text-transform: none !important; letter-spacing: 0 !important; font-size: 14px !important; font-weight: 700 !important; display: block !important; margin: 14px 0 7px !important; }
.sel-name { font-weight: 500 !important; }
.label-row { display: flex !important; align-items: baseline !important; justify-content: space-between !important; }
.sg-link { font-size: 13px !important; font-weight: 500 !important; color: #111 !important; }
.option-btn { color: #111 !important; font-family: inherit !important; font-size: 14px !important; font-weight: 600 !important; border-radius: 4px !important; padding: 10px 14px !important; }
.option-btn.selected { color: #fff !important; }
#sizeRow { flex-wrap: nowrap !important; gap: 8px !important; }
#sizeRow .option-btn { flex: 1 1 0 !important; padding: 10px 4px !important; }
#addBtn { padding: 16px !important; font-size: 15px !important; font-weight: 700 !important; }
.pay-line { font-size: 13px !important; }
@media (max-width: 899px) { .product-layout { grid-template-columns: minmax(0, 1fr) !important; } }
.product-photo, .product-info { min-width: 0 !important; max-width: 100% !important; }
.gallery-wrap { max-width: 100% !important; overflow: hidden !important; }
#sizeRow { max-width: 100% !important; }
#sizeRow .option-btn { min-width: 0 !important; }
#addBtn { background: #111 !important; color: #fff !important; }
.gtrack img { cursor: zoom-in; }
.g-counter { position: absolute; right: 10px; bottom: 10px; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; z-index: 3; }
@media (max-width: 899px) { .g-arrow { display: none; } }
.lightbox { position: fixed; inset: 0; background: #000; z-index: 300; }
.lightbox[hidden] { display: none; }
.lb-track-wrap { position: absolute; inset: 0; overflow: hidden; }
.lb-track { display: flex; height: 100%; transition: transform .3s ease; }
.lb-track img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: contain; }
.lb-close { position: absolute; top: 14px; right: 14px; z-index: 2; background: rgba(255,255,255,.15); color: #fff; border: none; width: 38px; height: 38px; border-radius: 50%; font-size: 17px; cursor: pointer; font-family: inherit; }
.lb-count { position: absolute; top: 22px; left: 16px; z-index: 2; color: #fff; font-size: 13px; font-weight: 600; }
.lb-arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; background: rgba(255,255,255,.15); color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 22px; cursor: pointer; font-family: inherit; }
.lb-arrow.prev { left: 10px; }
.lb-arrow.next { right: 10px; }
</style>
</head>
<body>

<header class="site-header slim-header">
  <div class="header-inner">
    <a class="logo" href="index.html">CROWN<span>LESS</span></a>
    <nav class="main-nav">
      <a href="index.html#men">Men</a>
      <a href="index.html#new">New Arrivals</a>
      <a href="index.html#sale">Sale</a>
    </nav>
    <div class="header-actions">
      <span class="account-links"><a href="login.html">Login</a></span>
      <a class="cart-link" href="cart.html" aria-label="Cart">🛍️<span class="cart-count">0</span></a>
    </div>
  </div>
</header>

<div class="top-strip"><div class="delivery-line">🚚 Delivery across Nigeria in 2-5 working days</div><div class="order-timer" id="orderTimer"></div></div>
<main class="wrap">
  <div id="productRoot"></div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div>
      <h3>CROWN<span>LESS</span></h3>
      <p style="opacity:.85; font-size:.92rem; margin-top:8px;">Bold fashion for men in Nigeria. Pay securely with Paystack. Delivery across Nigeria.</p>
    </div>
    <div>
      <strong>Shop</strong>
      <a href="index.html#men">Men</a>
      <a href="index.html#new">New Arrivals</a>
      <a href="index.html#sale">Sale</a>
    </div>
    <div>
      <strong>Account</strong>
      <a href="login.html">Login</a>
      <a href="signup.html">Sign Up</a>
      <a href="cart.html">Cart</a>
    </div>
  </div>
  <div class="footer-bottom">© 2026 CROWNLESS · Nigeria · Prices in ₦ (NGN)</div>
</footer>

<a class="wa-float" href="#" target="_blank" rel="noopener" aria-label="Chat with CROWNLESS on WhatsApp">💬</a>

<div class="lightbox" id="lightbox" hidden>
  <div class="lb-track-wrap"><div class="lb-track" id="lbTrack"></div></div>
  <div class="lb-count" id="lbCount"></div>
  <button class="lb-close" id="lbClose" type="button" aria-label="Close">\u2715</button>
  <button class="lb-arrow prev" id="lbPrev" type="button" aria-label="Previous photo">\u2039</button>
  <button class="lb-arrow next" id="lbNext" type="button" aria-label="Next photo">\u203a</button>
</div>

<script src="config.js"></script>
<script src="products.js"></script>
<script src="app.js"></script>
<script>
  var root = document.getElementById("productRoot");
  var id = new URLSearchParams(location.search).get("id");
  var product = id ? findProduct(id) : null;

  if (!product) {
    root.innerHTML = '<div class="section"><h2>Product not found</h2>' +
      '<p class="empty-note">This product does not exist. <a href="index.html" style="text-decoration:underline;">Back to shop</a></p></div>';
  } else {
    document.title = product.name + " — CROWNLESS";
    var selectedSize = null;
    var selectedColour = null;

    var badge = product.badge && product.badge.toLowerCase() !== "new"
      ? '<span class="badge badge-' + product.badge.toLowerCase() + '">' + product.badge + "</span>"
      : "";
    var old = product.oldPrice
      ? ' <span class="old-price">' + formatPrice(product.oldPrice) + "</span>"
      : "";
    var offPct = product.oldPrice ? Math.round((1 - product.price / product.oldPrice) * 100) : 0;
    var offTag = offPct ? ' <span class="off-tag">' + offPct + "% OFF</span>" : "";

    var photos = [product.image].concat(product.gallery || []);
    var slides = photos.map(function (src) {
      return '<img src="' + src + '" alt="' + product.name + '">';
    }).join("");
    var dots = photos.map(function (_, i) {
      return '<button class="dot' + (i === 0 ? " active" : "") + '" data-dot="' + i + '" type="button" aria-label="Photo ' + (i + 1) + '"></button>';
    }).join("");

    var genderLabel = product.gender === "women" ? "Women" : "Men";
    var shortDesc = product.details ? product.details.split(". ")[0] + "." : "";

    var others = PRODUCTS.filter(function (x) { return x.id !== product.id && x.gender === product.gender; });
    var sameCat = others.filter(function (x) { return x.category === product.category; });
    var diffCat = others.filter(function (x) { return x.category !== product.category; });
    var similar = sameCat.concat(diffCat).slice(0, 8);
    var styleWith = diffCat.slice(0, 4);
    var like = sameCat.concat(diffCat).slice(0, 4);

    function miniCard(x) {
      return '<a class="mini-card" href="product.html?id=' + x.id + '"><img src="' + x.image + '" alt="' + x.name + '">' +
        '<div class="mc-name">' + x.name + '</div><div class="mc-price">' + formatPrice(x.price) + "</div></a>";
    }
    function cardHTML(x) {
      var off = x.oldPrice ? Math.round((1 - x.price / x.oldPrice) * 100) : 0;
      var b = off
        ? '<span class="badge badge-sale">' + off + "% OFF</span>"
        : (x.badge && x.badge.toLowerCase() !== "new" ? '<span class="badge badge-' + x.badge.toLowerCase() + '">' + x.badge + "</span>" : "");
      var o = x.oldPrice ? ' <span class="old-price">' + formatPrice(x.oldPrice) + "</span>" : "";
      return '<article class="card">' + b +
        '<a href="product.html?id=' + x.id + '"><img src="' + x.image + '" alt="' + x.name + '"></a>' +
        '<div class="card-body"><a href="product.html?id=' + x.id + '"><h3>' + x.name + "</h3></a>" +
        '<div class="card-meta">' + x.category + "</div>" +
        '<div class="price">' + formatPrice(x.price) + o + "</div></div></article>";
    }

    root.innerHTML =
      '<div class="product-layout">' +
        '<div class="product-photo"><div class="gallery-wrap"><div class="gallery" id="gallery"><div class="gtrack" id="gtrack">' + slides + "</div></div>" + badge +
          '<button class="g-arrow prev" id="gPrev" type="button" aria-label="Previous photo">‹</button>' +
          '<button class="g-arrow next" id="gNext" type="button" aria-label="Next photo">›</button></div>' +
          '<div class="gallery-dots">' + dots + "</div>" + '<span class="g-counter" id="gCounter"></span></div>' +
        '<div class="product-info">' +
          '<div class="name-row"><h1>' + product.name + '</h1><button class="wish-btn" id="wishBtn" type="button" aria-label="Save to favorites">♡</button></div>' +
          '<div class="price' + (product.oldPrice ? " sale" : "") + '">' + formatPrice(product.price) + old + offTag + "</div>" +
          '<div class="pay-line">Pay securely with Paystack - or order on WhatsApp</div>' +
          '<span class="field-label">Colour: <span class="sel-name" id="colourName"></span></span><div class="option-row" id="colourRow">' +
            product.colours.map(function (c) { return '<button class="option-btn" data-colour="' + c + '">' + c + "</button>"; }).join("") +
          "</div>" +
          '<div class="label-row"><span class="field-label">Size</span><button class="sg-link" id="sgToggle" type="button">View Size Guide</button></div><div class="option-row" id="sizeRow">' +
            product.sizes.map(function (s) { return '<button class="option-btn" data-size="' + s + '">' + s + "</button>"; }).join("") +
          "</div>" +
          '<div class="size-guide" id="sizeGuide" hidden><table><tr><th>Size</th><th>Chest</th><th>Length</th></tr><tr><td>M</td><td>38-40 in</td><td>27 in</td></tr><tr><td>L</td><td>40-42 in</td><td>28 in</td></tr><tr><td>XL</td><td>42-44 in</td><td>29 in</td></tr><tr><td>XXL</td><td>44-46 in</td><td>30 in</td></tr></table><p>Measurements in inches. Between sizes? Size up for a relaxed fit.</p></div>' +
          '<div style="margin-top:20px;"><button class="btn btn-block" id="addBtn" type="button">Add to Bag</button></div>' +
          '<div class="toast" id="toast">Added to cart ✔ &nbsp;<a href="cart.html" style="text-decoration:underline; font-weight:800;">View cart &amp; checkout</a></div>' +
          '<div class="accordion open"><button class="acc-head" type="button">Product Details <span class="chev">▾</span></button><div class="acc-body">' + (product.details || "") + "</div></div>" +
          '<div class="accordion"><button class="acc-head" type="button">Material &amp; Care <span class="chev">▾</span></button><div class="acc-body">' + (product.material || "") + "</div></div>" +
          '<div class="accordion"><button class="acc-head" type="button">Delivery &amp; Returns <span class="chev">▾</span></button><div class="acc-body">Delivery across Nigeria in 2-5 working days; the delivery fee is calculated at checkout. Pay securely with Paystack, or message us on WhatsApp to order. Wrong size? Chat with us on WhatsApp within 7 days of delivery for an exchange.</div></div>' +
        "</div>" +
      "</div>" +
      '<div class="rel-section"><h2 class="section-title">Similar Styles</h2><div class="hscroll">' + similar.map(miniCard).join("") + "</div></div>" +
      '<div class="rel-section"><h2 class="section-title">Style It With</h2><div class="hscroll">' + styleWith.map(miniCard).join("") + "</div></div>" +
      '<div class="rel-section"><h2 class="section-title">You Might Also Like</h2><div class="grid">' + like.map(cardHTML).join("") + "</div></div>";

    // Order-within countdown to midnight, like Nova's delivery timer
    var timerEl = document.getElementById("orderTimer");
    function tickTimer() {
      var now = new Date();
      var end = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0);
      var ms = end - now;
      var hrs = Math.floor(ms / 3600000);
      var mins = Math.floor((ms % 3600000) / 60000);
      timerEl.textContent = (hrs > 0 ? "Order within " + hrs + " hrs " + mins + " mins" : "Order within " + mins + " mins") + " - welcome offer ends tonight";
    }
    tickTimer();
    setInterval(tickTimer, 20000);

    // Swipeable gallery: sliding track - arrows, dots and touch swipe move the track
    var galleryEl = document.getElementById("gallery");
    var trackEl = document.getElementById("gtrack");
    var dotEls = document.querySelectorAll(".gallery-dots .dot");
    var slideCount = trackEl.querySelectorAll("img").length;
    var curSlide = 0;
    function slideStep() {
      var imgs = trackEl.querySelectorAll("img");
      return imgs.length > 1 ? (imgs[1].offsetLeft - imgs[0].offsetLeft) : galleryEl.clientWidth;
    }
    function goTo(i) {
      curSlide = Math.max(0, Math.min(slideCount - 1, i));
      trackEl.style.transform = "translateX(" + (-curSlide * slideStep()) + "px)";
      dotEls.forEach(function (d, di) { d.classList.toggle("active", di === curSlide); });
      syncCounter();
    }
    document.getElementById("gPrev").addEventListener("click", function () { goTo(curSlide - 1); });
    document.getElementById("gNext").addEventListener("click", function () { goTo(curSlide + 1); });
    dotEls.forEach(function (d) {
      d.addEventListener("click", function () { goTo(parseInt(d.getAttribute("data-dot"), 10)); });
    });
    var touchX = null, touchY = null;
    galleryEl.addEventListener("touchstart", function (e) {
      touchX = e.changedTouches[0].clientX;
      touchY = e.changedTouches[0].clientY;
    }, { passive: true });
    galleryEl.addEventListener("touchend", function (e) {
      if (touchX === null) { return; }
      var dx = e.changedTouches[0].clientX - touchX;
      var dy = e.changedTouches[0].clientY - touchY;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { lastSwipeAt = Date.now(); goTo(curSlide + (dx < 0 ? 1 : -1)); }
      touchX = null; touchY = null;
    }, { passive: true });

    // Photo counter + tap-to-enlarge fullscreen viewer
    var counterEl = document.getElementById("gCounter");
    function syncCounter() { counterEl.textContent = (curSlide + 1) + " / " + slideCount; }
    syncCounter();
    var lastSwipeAt = 0;
    var lightbox = document.getElementById("lightbox");
    var lbTrack = document.getElementById("lbTrack");
    var lbCount = document.getElementById("lbCount");
    var lbIdx = 0;
    lbTrack.innerHTML = photos.map(function (src) { return '<img src="' + src + '" alt="' + product.name + '">'; }).join("");
    function lbGoTo(i) {
      lbIdx = Math.max(0, Math.min(slideCount - 1, i));
      lbTrack.style.transform = "translateX(" + (-lbIdx * 100 / slideCount) + "%)";
      lbCount.textContent = (lbIdx + 1) + " / " + slideCount;
    }
    function openLightbox() {
      lbGoTo(curSlide);
      lightbox.hidden = false;
      document.body.style.overflow = "hidden";
    }
    function closeLightbox() {
      lightbox.hidden = true;
      document.body.style.overflow = "";
      goTo(lbIdx);
    }
    document.getElementById("lbClose").addEventListener("click", closeLightbox);
    document.getElementById("lbPrev").addEventListener("click", function () { lbGoTo(lbIdx - 1); });
    document.getElementById("lbNext").addEventListener("click", function () { lbGoTo(lbIdx + 1); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !lightbox.hidden) { closeLightbox(); } });
    var lbX = null, lbY = null;
    lightbox.addEventListener("touchstart", function (e) { lbX = e.changedTouches[0].clientX; lbY = e.changedTouches[0].clientY; }, { passive: true });
    lightbox.addEventListener("touchend", function (e) {
      if (lbX === null) { return; }
      var dx = e.changedTouches[0].clientX - lbX;
      var dy = e.changedTouches[0].clientY - lbY;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { lbGoTo(lbIdx + (dx < 0 ? 1 : -1)); }
      lbX = null; lbY = null;
    }, { passive: true });
    trackEl.querySelectorAll("img").forEach(function (img) {
      img.addEventListener("click", function () {
        if (Date.now() - lastSwipeAt < 350) { return; }
        openLightbox();
      });
    });

    document.getElementById("sgToggle").addEventListener("click", function () {
      var g = document.getElementById("sizeGuide");
      g.hidden = !g.hidden;
    });

    function wireOptions(rowId, attr, set) {
      document.querySelectorAll("#" + rowId + " .option-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          document.querySelectorAll("#" + rowId + " .option-btn").forEach(function (b) { b.classList.remove("selected"); });
          btn.classList.add("selected");
          set(btn.getAttribute(attr));
        });
      });
    }
    wireOptions("sizeRow", "data-size", function (v) { selectedSize = v; });
    wireOptions("colourRow", "data-colour", function (v) {
      selectedColour = v;
      document.getElementById("colourName").textContent = v;
      if (photos.length === product.colours.length * 2) { goTo(product.colours.indexOf(v) * 2); }
    });
    var firstColour = document.querySelector("#colourRow .option-btn");
    if (firstColour) { firstColour.click(); }

    var wishBtn = document.getElementById("wishBtn");
    wishBtn.addEventListener("click", function () {
      var on = wishBtn.classList.toggle("active");
      wishBtn.textContent = on ? "♥" : "♡";
    });

    function doAdd() {
      if (!selectedSize) { alert("Please pick a size first."); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
      if (!selectedColour) { alert("Please pick a colour first."); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
      addToCart(product.id, selectedSize, selectedColour, 1);
      document.getElementById("toast").classList.add("show");
    }
    document.getElementById("addBtn").addEventListener("click", doAdd);

    // Accordions (Product Details / Material & Care / Delivery & Returns)
    document.querySelectorAll(".acc-head").forEach(function (h) {
      h.addEventListener("click", function () { h.parentElement.classList.toggle("open"); });
    });

  }
</script>
</body>
</html>
