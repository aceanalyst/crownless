<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — CROWNLESS</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="index.html">CROWN<span>LESS</span></a>
    <nav class="main-nav">
      <a href="index.html#women">Women</a>
      <a href="index.html#men">Men</a>
      <a href="index.html#new">New Arrivals</a>
      <a href="index.html#sale">Sale</a>
    </nav>
    <div class="header-actions">
      <span class="account-links"><a href="login.html">Login</a></span>
      <a class="cart-link" href="cart.html" aria-label="Cart">🛍️<span class="cart-count">0</span></a>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="productRoot"></div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div>
      <h3>CROWN<span>LESS</span></h3>
      <p style="opacity:.85; font-size:.92rem; margin-top:8px;">Bold fashion for women &amp; men in Nigeria. Pay securely with Paystack. Delivery across Nigeria.</p>
    </div>
    <div>
      <strong>Shop</strong>
      <a href="index.html#women">Women</a>
      <a href="index.html#men">Men</a>
      <a href="index.html#new">New Arrivals</a>
      <a href="index.html#sale">Sale</a>
    </div>
    <div>
      <strong>Account</strong>
      <a href="login.html">Login</a>
      <a href="signup.html">Sign Up</a>
      <a href="cart.html">Cart</a>
    </div>
  </div>
  <div class="footer-bottom">© 2026 CROWNLESS · Nigeria · Prices in ₦ (NGN)</div>
</footer>

<a class="wa-float" href="#" target="_blank" rel="noopener" aria-label="Chat with CROWNLESS on WhatsApp">💬</a>

<script src="config.js"></script>
<script src="products.js"></script>
<script src="app.js"></script>
<script>
  var root = document.getElementById("productRoot");
  var id = new URLSearchParams(location.search).get("id");
  var product = id ? findProduct(id) : null;

  if (!product) {
    root.innerHTML = '<div class="section"><h2>Product not found</h2>' +
      '<p class="empty-note">This product does not exist. <a href="index.html" style="text-decoration:underline;">Back to shop</a></p></div>';
  } else {
    document.title = product.name + " — CROWNLESS";
    var selectedSize = null;
    var selectedColour = null;

    var badge = product.badge
      ? '<span class="badge badge-' + product.badge.toLowerCase() + '">' + product.badge + "</span>"
      : "";
    var old = product.oldPrice
      ? ' <span class="old-price">' + formatPrice(product.oldPrice) + "</span>"
      : "";

    var photos = [product.image].concat(product.gallery || []);
    var slides = photos.map(function (src) {
      return '<img src="' + src + '" alt="' + product.name + '">';
    }).join("");
    var dots = photos.map(function (_, i) {
      return '<button class="dot' + (i === 0 ? " active" : "") + '" data-dot="' + i + '" type="button" aria-label="Photo ' + (i + 1) + '"></button>';
    }).join("");

    root.innerHTML =
      '<div class="product-layout">' +
        '<div class="product-photo"><div class="gallery-wrap"><div class="gallery" id="gallery">' + slides + "</div>" + badge +
          '<button class="g-arrow prev" id="gPrev" type="button" aria-label="Previous photo">‹</button>' +
          '<button class="g-arrow next" id="gNext" type="button" aria-label="Next photo">›</button></div>' +
          '<div class="gallery-dots">' + dots + "</div></div>" +
        '<div class="product-info">' +
          "<h1>" + product.name + "</h1>" +
          '<div class="card-meta">' + product.category + " · " + (product.gender === "women" ? "Women" : "Men") + "</div>" +
          '<div class="price">' + formatPrice(product.price) + old + "</div>" +
          '<p class="product-desc">Sample product — full description, fabric details and care instructions will be added when the real CROWNLESS range drops.</p>' +
          '<span class="field-label">Size</span><div class="option-row" id="sizeRow">' +
            product.sizes.map(function (s) { return '<button class="option-btn" data-size="' + s + '">' + s + "</button>"; }).join("") +
          "</div>" +
          '<span class="field-label">Colour</span><div class="option-row" id="colourRow">' +
            product.colours.map(function (c) { return '<button class="option-btn" data-colour="' + c + '">' + c + "</button>"; }).join("") +
          "</div>" +
          '<span class="field-label">Quantity</span>' +
          '<div class="qty-row"><button id="qtyMinus" type="button">−</button><input id="qtyInput" type="text" value="1" readonly><button id="qtyPlus" type="button">+</button></div>' +
          '<div style="margin-top:22px;"><button class="btn btn-block" id="addBtn" type="button">Add to Cart</button></div>' +
          '<div class="toast" id="toast">Added to cart ✔ &nbsp;<a href="cart.html" style="text-decoration:underline; font-weight:800;">View cart &amp; checkout</a></div>' +
        "</div>" +
      "</div>";

    // Swipeable gallery: native swipe + arrows + dots
    var galleryEl = document.getElementById("gallery");
    var dotEls = document.querySelectorAll(".gallery-dots .dot");
    function slideIndex() {
      return Math.round(galleryEl.scrollLeft / galleryEl.clientWidth);
    }
    function markDots() {
      var i = slideIndex();
      dotEls.forEach(function (d, di) { d.classList.toggle("active", di === i); });
    }
    galleryEl.addEventListener("scroll", markDots, { passive: true });
    document.getElementById("gPrev").addEventListener("click", function () {
      galleryEl.scrollBy({ left: -galleryEl.clientWidth, behavior: "smooth" });
    });
    document.getElementById("gNext").addEventListener("click", function () {
      galleryEl.scrollBy({ left: galleryEl.clientWidth, behavior: "smooth" });
    });
    dotEls.forEach(function (d) {
      d.addEventListener("click", function () {
        var i = parseInt(d.getAttribute("data-dot"), 10);
        galleryEl.scrollTo({ left: i * galleryEl.clientWidth, behavior: "smooth" });
      });
    });

    function wireOptions(rowId, attr, set) {
      document.querySelectorAll("#" + rowId + " .option-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          document.querySelectorAll("#" + rowId + " .option-btn").forEach(function (b) { b.classList.remove("selected"); });
          btn.classList.add("selected");
          set(btn.getAttribute(attr));
        });
      });
    }
    wireOptions("sizeRow", "data-size", function (v) { selectedSize = v; });
    wireOptions("colourRow", "data-colour", function (v) { selectedColour = v; });

    var qtyInput = document.getElementById("qtyInput");
    document.getElementById("qtyMinus").addEventListener("click", function () {
      qtyInput.value = Math.max(1, parseInt(qtyInput.value, 10) - 1);
    });
    document.getElementById("qtyPlus").addEventListener("click", function () {
      qtyInput.value = Math.min(99, parseInt(qtyInput.value, 10) + 1);
    });

    document.getElementById("addBtn").addEventListener("click", function () {
      if (!selectedSize) { alert("Please pick a size first."); return; }
      if (!selectedColour) { alert("Please pick a colour first."); return; }
      addToCart(product.id, selectedSize, selectedColour, parseInt(qtyInput.value, 10) || 1);
      document.getElementById("toast").classList.add("show");
    });
  }
</script>
</body>
</html>
